<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div class="card">
       <div class="bio">
         <img src="https://tse2.mm.bing.net/th/id/OIP.so5s5QgNUgKSgouiR2R1zQHaHa?rs=1&pid=ImgDetMain&o=7&rm=3" class="profile-img" alt="Profile Image">
        </div>
        <h2 class="name">Kaushal Raj</h2>
        <p>Frontend Developer</p>
       <div class="icons">
            <i class="fab fa-facebook-f"></i>
            <i class="fab fa-twitter"></i>
            <i class="fab fa-linkedin-in"></i>
             <i class="fab fa-instagram"></i>
        </div>
        <div class="contact">
            <button class="subscribe"> Subscribe</button>
            <button class="message">Message</button>
        </div>
        <div class="data">
            <div class="followers">
                <h3 class="f1">Followers</h3>
                <p>1.2K</p>
            </div>
            <div class="following">
                <h3 class="f1">Following</h3>
                <p>500</p>
            </div>
             <div class="posts">
                <h3>Posts</h3>
                <p>150</p>
        </div>
       </div>
        
    </div>
    
    
</body>
</html>
