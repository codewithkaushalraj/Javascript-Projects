<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit </title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>Drum Kit</h1>
    <div id="instrument">
        <div class="box boom">
            <p class="butt">A</p>
            <p class="sound">boom</p>
            <audio src="./Sounds/projects_drum-kit_sounds_boom.wav" id="boom"></audio>
        </div>
        <div class="box clap">
            <p class="butt">S</p>
            <p class="sound">clap</p>
            <audio src="./Sounds/projects_drum-kit_sounds_clap.wav" id="clap"></audio>
        </div>
        <div class="box hihat">
            <p class="butt">D</p>
            <p class="sound">hithat</p>
            <audio src="./Sounds/projects_drum-kit_sounds_hihat.wav" id="hihat"></audio>
        </div>
        <div class="box kick">
            <p class="butt">F</p>
            <p class="sound">kick</p>
            <audio src="./Sounds/projects_drum-kit_sounds_kick.wav" id="kick"></audio>
        </div>
        <div class="box openhat">
            <p class="butt">G</p>
            <p class="sound">Openhat</p>
            <audio src="./Sounds/projects_drum-kit_sounds_openhat.wav" id="openhat"></audio>
        </div>
        <div class="box ride">
            <p class="butt">H</p>
            <p class="sound">Ride</p>
            <audio src="./Sounds/projects_drum-kit_sounds_ride.wav" id="ride"></audio>
        </div>
        <div class="box snare">
            <p class="butt">J</p>
            <p class="sound">Snare</p>
            <audio src="./Sounds/projects_drum-kit_sounds_snare.wav" id="snare"></audio>
        </div>
        <div class="box tink">
            <p class="butt">K</p>
            <p class="sound">Tink</p>
            <audio src="./Sounds/projects_drum-kit_sounds_tink.wav" id="tink"></audio>
        </div>
        <div class="box sound_tom">
            <p class="butt">L</p>
            <p class="sound">Tom</p>
            <audio src="./Sounds/projects_drum-kit_sounds_tom.wav" id="sound_tom"></audio>
        </div>

    </div>
    <script src="./first.js"></script>
</body>

</html>
